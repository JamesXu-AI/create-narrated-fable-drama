[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "create-narrated-fable-drama"
version = "1.0.0"
description = "Repository-local production workflow for 16:9 narrated fable dramas."
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2,<2",
]

[project.scripts]
narrated-fable-drama = "narrated_fable_drama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_provider: requires real remote provider credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
